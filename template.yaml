AWSTemplateFormatVersion: "2010-09-09"
Description: Connected-car telemetry v4.1 - IoT Core -> Lambda transform -> Firehose -> S3 -> Glue/Athena, DynamoDB latest state, SNS alerts, CloudWatch observability, device policy

Parameters:
  AlertEmail:
    Type: String
    Description: Email that receives driver/support alerts AND operations alarms
  LowTyrePsi:
    Type: Number
    Default: 28
  EnableNoDataAlarm:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Alarm when no vehicle messages arrive for 10 minutes (turn on in production or for the alarm test)

Conditions:
  NoDataAlarmOn: !Equals [!Ref EnableNoDataAlarm, "true"]

Resources:
  # ---------------------------------------------------------------- storage
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - { Id: expire-raw-backup, Status: Enabled, Prefix: raw/, ExpirationInDays: 90 }
          - { Id: expire-errors, Status: Enabled, Prefix: errors/, ExpirationInDays: 30 }
          - { Id: expire-athena-results, Status: Enabled, Prefix: athena-results/, ExpirationInDays: 30 }

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # ---------------------------------------------------------------- logs
  FirehoseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /vehicle-telemetry/firehose
      RetentionInDays: 30

  FirehoseLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref FirehoseLogGroup
      LogStreamName: S3Delivery

  IotErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /vehicle-telemetry/iot-rule-errors
      RetentionInDays: 30

  TransformLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vehicle-telemetry-transform
      RetentionInDays: 30

  # ---------------------------------------------------------------- transform (validate + normalise)
  TransformRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt TransformLogGroup.Arn

  TransformFunction:
    Type: AWS::Lambda::Function
    DependsOn: TransformLogGroup
    Properties:
      FunctionName: vehicle-telemetry-transform
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TransformRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        ZipFile: |
          import base64, json, math

          # field -> (min, max) physical plausibility range
          FLOATS = {
              "tyre_fl_psi": (0, 100), "tyre_fr_psi": (0, 100),
              "tyre_rl_psi": (0, 100), "tyre_rr_psi": (0, 100),
              "accelerator_pct": (0, 100), "clutch_pct": (0, 100),
              "speed_kmph": (0, 400), "fuel_level_pct": (0, 100),
              "fuel_efficiency_kmpl": (0, 100),
          }
          HELPERS = ("topic_vehicle_id",)


          def normalize(raw):
              """Known fields are typed and range-checked; unknown fields are kept in 'extras'."""
              if not isinstance(raw, dict):
                  raise ValueError("payload is not a JSON object")
              issues = []
              vid = raw.get("vehicle_id")
              topic_id = raw.get("topic_vehicle_id")  # taken from the authenticated MQTT topic
              if topic_id:
                  if vid and vid != topic_id:
                      issues.append("vehicle_id_mismatch")
                  vid = topic_id
              if not vid or not isinstance(vid, str):
                  raise ValueError("missing vehicle_id")
              out = {"vehicle_id": vid, "event_time": raw.get("event_time"),
                     "ingest_ts": raw.get("ingest_ts"),
                     "schema_version": str(raw.get("schema_version", "1"))}
              if out["event_time"] is None:
                  issues.append("missing_event_time")
              for f, (lo, hi) in FLOATS.items():
                  v = raw.get(f)
                  if v is None:
                      out[f] = None
                      continue
                  try:
                      if isinstance(v, bool):
                          raise ValueError
                      x = float(v)
                      if not math.isfinite(x):
                          raise ValueError
                  except (TypeError, ValueError):
                      out[f] = None
                      issues.append("not_numeric:" + f)
                      continue
                  if x < lo or x > hi:
                      out[f] = None
                      issues.append("out_of_range:" + f)
                  else:
                      out[f] = x
              extras = {k: v for k, v in raw.items() if k not in out and k not in HELPERS}
              out["extras"] = json.dumps(extras, separators=(",", ":")) if extras else None
              out["dq_issues"] = ",".join(issues) if issues else None
              return out


          def handler(event, context):
              records = []
              for r in event["records"]:
                  try:
                      out = normalize(json.loads(base64.b64decode(r["data"])))
                      data = base64.b64encode((json.dumps(out, separators=(",", ":")) + "\n").encode()).decode()
                      records.append({"recordId": r["recordId"], "result": "Ok", "data": data})
                  except Exception:
                      # unparseable or no vehicle_id: Firehose writes the ORIGINAL to errors/processing-failed
                      records.append({"recordId": r["recordId"], "result": "ProcessingFailed", "data": r["data"]})
              return {"records": records}

  # ---------------------------------------------------------------- delivery stream
  FirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: firehose.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: firehose-permissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub "${DataBucket.Arn}/*"
              - Effect: Allow
                Action: [lambda:InvokeFunction, lambda:GetFunctionConfiguration]
                Resource: !GetAtt TransformFunction.Arn
              - Effect: Allow
                Action: logs:PutLogEvents
                Resource: !GetAtt FirehoseLogGroup.Arn

  DeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN: !GetAtt DataBucket.Arn
        RoleARN: !GetAtt FirehoseRole.Arn
        Prefix: "telemetry/dt=!{timestamp:yyyy-MM-dd}/hr=!{timestamp:HH}/"
        ErrorOutputPrefix: "errors/!{firehose:error-output-type}/dt=!{timestamp:yyyy-MM-dd}/"
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 1
        CompressionFormat: UNCOMPRESSED
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseLogGroup
          LogStreamName: !Ref FirehoseLogStream
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Lambda
              Parameters:
                - { ParameterName: LambdaArn, ParameterValue: !GetAtt TransformFunction.Arn }
                - { ParameterName: NumberOfRetries, ParameterValue: "3" }
                - { ParameterName: BufferSizeInMBs, ParameterValue: "1" }
                - { ParameterName: BufferIntervalInSeconds, ParameterValue: "60" }
        S3BackupMode: Enabled
        S3BackupConfiguration:
          BucketARN: !GetAtt DataBucket.Arn
          RoleARN: !GetAtt FirehoseRole.Arn
          Prefix: "raw/dt=!{timestamp:yyyy-MM-dd}/"
          ErrorOutputPrefix: "errors/raw-backup/!{firehose:error-output-type}/dt=!{timestamp:yyyy-MM-dd}/"
          BufferingHints:
            IntervalInSeconds: 60
            SizeInMBs: 1
          CompressionFormat: UNCOMPRESSED

  # ---------------------------------------------------------------- notifications
  AlertTopic:
    Type: AWS::SNS::Topic

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  OpsTopic:
    Type: AWS::SNS::Topic

  OpsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OpsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ---------------------------------------------------------------- IoT rules
  IotRuleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: iot.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: iot-rule-actions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: firehose:PutRecord
                Resource: !GetAtt DeliveryStream.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt LatestStateTable.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt IotErrorLogGroup.Arn

  TelemetryRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: vehicle_telemetry_to_s3
      TopicRulePayload:
        Sql: "SELECT *, topic(2) AS topic_vehicle_id, timestamp() AS ingest_ts FROM 'vehicles/+/telemetry'"
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Actions:
          - Firehose:
              DeliveryStreamName: !Ref DeliveryStream
              RoleArn: !GetAtt IotRuleRole.Arn
              Separator: "\n"
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref IotErrorLogGroup
            RoleArn: !GetAtt IotRuleRole.Arn

  LowTyreRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: vehicle_low_tyre_alert
      TopicRulePayload:
        Sql: !Sub >-
          SELECT topic(2) AS vehicle_id, event_time, tyre_fl_psi, tyre_fr_psi, tyre_rl_psi, tyre_rr_psi
          FROM 'vehicles/+/telemetry'
          WHERE tyre_fl_psi < ${LowTyrePsi} OR tyre_fr_psi < ${LowTyrePsi}
          OR tyre_rl_psi < ${LowTyrePsi} OR tyre_rr_psi < ${LowTyrePsi}
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Actions:
          - Sns:
              TargetArn: !Ref AlertTopic
              RoleArn: !GetAtt IotRuleRole.Arn
              MessageFormat: RAW
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref IotErrorLogGroup
            RoleArn: !GetAtt IotRuleRole.Arn

  LatestStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vehicle-latest-state
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - { AttributeName: vehicle_id, AttributeType: S }
      KeySchema:
        - { AttributeName: vehicle_id, KeyType: HASH }

  LatestStateRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: vehicle_latest_state_to_dynamodb
      TopicRulePayload:
        # vehicle_id comes from the authenticated MQTT topic, never from the payload (v4.1 fix):
        # a payload without vehicle_id failed with "Missing the key vehicle_id", and a payload
        # claiming another id would have created an item for that other vehicle.
        Sql: >-
          SELECT topic(2) AS vehicle_id, event_time, tyre_fl_psi, tyre_fr_psi, tyre_rl_psi, tyre_rr_psi,
          accelerator_pct, clutch_pct, speed_kmph, fuel_level_pct, fuel_efficiency_kmpl,
          timestamp() AS ingest_ts FROM 'vehicles/+/telemetry'
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Actions:
          - DynamoDBv2:
              PutItem:
                TableName: !Ref LatestStateTable
              RoleArn: !GetAtt IotRuleRole.Arn
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref IotErrorLogGroup
            RoleArn: !GetAtt IotRuleRole.Arn

  # ---------------------------------------------------------------- device identity (real hardware)
  DevicePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: vehicle-device-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:Connection.Thing.ThingName}"
          - Effect: Allow
            Action: iot:Publish
            Resource: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/vehicles/${!iot:Connection.Thing.ThingName}/telemetry"
          - Effect: Allow
            Action: iot:Subscribe
            Resource: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/vehicles/${!iot:Connection.Thing.ThingName}/commands/*"
          - Effect: Allow
            Action: iot:Receive
            Resource: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/vehicles/${!iot:Connection.Thing.ThingName}/commands/*"

  # ---------------------------------------------------------------- catalog + query
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: vehicle_telemetry

  TelemetryTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: telemetry
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2026-10-01,NOW"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          projection.hr.type: integer
          projection.hr.range: "0,23"
          projection.hr.digits: "2"
          storage.location.template: !Sub "s3://${DataBucket}/telemetry/dt=${!dt}/hr=${!hr}/"
        PartitionKeys:
          - { Name: dt, Type: string }
          - { Name: hr, Type: string }
        StorageDescriptor:
          Location: !Sub "s3://${DataBucket}/telemetry/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters:
              ignore.malformed.json: "true"
          Columns:
            - { Name: vehicle_id, Type: string }
            - { Name: event_time, Type: string }
            - { Name: tyre_fl_psi, Type: double }
            - { Name: tyre_fr_psi, Type: double }
            - { Name: tyre_rl_psi, Type: double }
            - { Name: tyre_rr_psi, Type: double }
            - { Name: accelerator_pct, Type: double }
            - { Name: clutch_pct, Type: double }
            - { Name: speed_kmph, Type: double }
            - { Name: fuel_level_pct, Type: double }
            - { Name: fuel_efficiency_kmpl, Type: double }
            - { Name: ingest_ts, Type: bigint }
            - { Name: schema_version, Type: string }
            - { Name: extras, Type: string }
            - { Name: dq_issues, Type: string }

  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: vehicle-telemetry
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        BytesScannedCutoffPerQuery: 1073741824
        ResultConfiguration:
          OutputLocation: !Sub "s3://${DataBucket}/athena-results/"
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

  # ---------------------------------------------------------------- observability
  NoDataAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: NoDataAlarmOn
    Properties:
      AlarmName: vehicle-telemetry-no-data
      AlarmDescription: No MQTT messages received for 10 minutes (fleet silent or ingestion broken)
      Namespace: AWS/IoT
      MetricName: PublishIn.Success
      Dimensions: [{ Name: Protocol, Value: MQTT }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref OpsTopic]
      OKActions: [!Ref OpsTopic]

  RuleFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vehicle-telemetry-iot-rule-failures
      AlarmDescription: An IoT rule failed to run its action (see log group /vehicle-telemetry/iot-rule-errors)
      Metrics:
        - { Id: m1, ReturnData: false, MetricStat: { Metric: { Namespace: AWS/IoT, MetricName: Failure, Dimensions: [{ Name: RuleName, Value: vehicle_telemetry_to_s3 }] }, Period: 300, Stat: Sum } }
        - { Id: m2, ReturnData: false, MetricStat: { Metric: { Namespace: AWS/IoT, MetricName: Failure, Dimensions: [{ Name: RuleName, Value: vehicle_low_tyre_alert }] }, Period: 300, Stat: Sum } }
        - { Id: m3, ReturnData: false, MetricStat: { Metric: { Namespace: AWS/IoT, MetricName: Failure, Dimensions: [{ Name: RuleName, Value: vehicle_latest_state_to_dynamodb }] }, Period: 300, Stat: Sum } }
        - { Id: total, Expression: "FILL(m1,0)+FILL(m2,0)+FILL(m3,0)", Label: rule failures, ReturnData: true }
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  FirehoseDeliveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vehicle-telemetry-firehose-delivery
      AlarmDescription: Firehose failed to deliver to S3
      Namespace: AWS/Firehose
      MetricName: DeliveryToS3.Success
      Dimensions: [{ Name: DeliveryStreamName, Value: !Ref DeliveryStream }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  FirehoseFreshnessAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vehicle-telemetry-data-freshness
      AlarmDescription: Oldest record waiting in Firehose is older than 15 minutes
      Namespace: AWS/Firehose
      MetricName: DeliveryToS3.DataFreshness
      Dimensions: [{ Name: DeliveryStreamName, Value: !Ref DeliveryStream }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  TransformErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vehicle-telemetry-transform-errors
      AlarmDescription: The validation Lambda crashed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref TransformFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  AlertDeliveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vehicle-telemetry-alert-delivery-failed
      AlarmDescription: SNS could not deliver a driver/support alert
      Namespace: AWS/SNS
      MetricName: NumberOfNotificationsFailed
      Dimensions: [{ Name: TopicName, Value: !GetAtt AlertTopic.TopicName }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: vehicle-telemetry
      DashboardBody: !Sub |
        {"widgets":[
         {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Messages from vehicles (MQTT publish in)","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["AWS/IoT","PublishIn.Success","Protocol","MQTT"]]}},
         {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"IoT rule success / failure","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["AWS/IoT","Success","RuleName","vehicle_telemetry_to_s3"],["AWS/IoT","Failure","RuleName","vehicle_telemetry_to_s3"],["AWS/IoT","Success","RuleName","vehicle_latest_state_to_dynamodb"],["AWS/IoT","Failure","RuleName","vehicle_latest_state_to_dynamodb"],["AWS/IoT","Success","RuleName","vehicle_low_tyre_alert"],["AWS/IoT","Failure","RuleName","vehicle_low_tyre_alert"]]}},
         {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Firehose records and delivery","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["AWS/Firehose","IncomingRecords","DeliveryStreamName","${DeliveryStream}"],["AWS/Firehose","DeliveryToS3.Records","DeliveryStreamName","${DeliveryStream}"]]}},
         {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Data freshness (seconds)","region":"${AWS::Region}","stat":"Maximum","period":60,"metrics":[["AWS/Firehose","DeliveryToS3.DataFreshness","DeliveryStreamName","${DeliveryStream}"]]}},
         {"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{"title":"Validation Lambda","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["AWS/Lambda","Invocations","FunctionName","${TransformFunction}"],["AWS/Lambda","Errors","FunctionName","${TransformFunction}"]]}},
         {"type":"metric","x":12,"y":12,"width":12,"height":6,"properties":{"title":"Alert emails (SNS)","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["AWS/SNS","NumberOfMessagesPublished","TopicName","${AlertTopic.TopicName}"],["AWS/SNS","NumberOfNotificationsFailed","TopicName","${AlertTopic.TopicName}"]]}},
         {"type":"alarm","x":0,"y":18,"width":24,"height":4,"properties":{"title":"Alarm status","alarms":["${RuleFailureAlarm.Arn}","${FirehoseDeliveryAlarm.Arn}","${FirehoseFreshnessAlarm.Arn}","${TransformErrorAlarm.Arn}","${AlertDeliveryAlarm.Arn}"]}}
        ]}

Outputs:
  Bucket:
    Value: !Ref DataBucket
  TopicPattern:
    Value: vehicles/<vehicle_id>/telemetry
  AthenaWorkgroup:
    Value: !Ref AthenaWorkgroup
  LatestStateTable:
    Value: !Ref LatestStateTable
  DashboardName:
    Value: vehicle-telemetry
  DevicePolicyName:
    Value: vehicle-device-policy
