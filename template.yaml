AWSTemplateFormatVersion: "2010-09-09"
Description: Connected-car telemetry v5.0 (production) - IoT Core -> Kinesis Data Stream -> (Firehose + validation Lambda -> Parquet in S3 -> Glue/Athena) and (state Lambda -> DynamoDB latest state + alerts with hysteresis), offline detection, DLQ, CloudWatch alarms, per-device X.509 policy

Parameters:
  AlertEmail:
    Type: String
    Description: Email that receives driver/support alerts AND operations alarms
  LowTyrePsi:
    Type: Number
    Default: 28
  EnableNoDataAlarm:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Alarm when no vehicle messages arrive for 10 minutes (turn on in production or for the alarm test)
  StreamMode:
    Type: String
    Default: PROVISIONED
    AllowedValues: [PROVISIONED, ON_DEMAND]
    Description: PROVISIONED with ShardCount is cheapest for a demo; ON_DEMAND scales shards automatically (production)
  ShardCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 50
    Description: Only for PROVISIONED. One shard takes 1,000 records/s or 1 MB/s of writes
  BufferIntervalSeconds:
    Type: Number
    Default: 60
    MinValue: 60
    MaxValue: 900
    Description: Firehose waits this long (or for 64 MB) before writing a Parquet file. 60 for demos, 300-900 in production (fewer, larger files)
  AlertCooldownSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    Description: After a low-tyre e-mail for a vehicle, further e-mails for the same vehicle are suppressed for this long
  OfflineAfterMinutes:
    Type: Number
    Default: 10
    MinValue: 2
    Description: A vehicle with no reading for this long is reported offline (one summary e-mail per check)
  StateBatchSize:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 1000
    Description: Kinesis records per invocation of the latest-state Lambda

Conditions:
  NoDataAlarmOn: !Equals [!Ref EnableNoDataAlarm, "true"]
  Provisioned: !Equals [!Ref StreamMode, PROVISIONED]

Resources:
  # ---------------------------------------------------------------- storage
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - { Id: expire-raw-backup, Status: Enabled, Prefix: raw/, ExpirationInDays: 90 }
          - { Id: expire-errors, Status: Enabled, Prefix: errors/, ExpirationInDays: 30 }
          - { Id: expire-athena-results, Status: Enabled, Prefix: athena-results/, ExpirationInDays: 30 }
          - Id: telemetry-to-infrequent-access
            Status: Enabled
            Prefix: telemetry/
            Transitions: [{ StorageClass: STANDARD_IA, TransitionInDays: 30 }]
          - Id: clean-old-versions-and-uploads
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # ---------------------------------------------------------------- logs
  FirehoseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /vehicle-telemetry/firehose
      RetentionInDays: 30

  FirehoseLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref FirehoseLogGroup
      LogStreamName: S3Delivery

  IotErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /vehicle-telemetry/iot-rule-errors
      RetentionInDays: 30

  TransformLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vehicle-telemetry-transform
      RetentionInDays: 30

  StateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vehicle-telemetry-state
      RetentionInDays: 30

  # ---------------------------------------------------------------- transform (validate + normalise)
  TransformRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt TransformLogGroup.Arn

  TransformFunction:
    Type: AWS::Lambda::Function
    DependsOn: TransformLogGroup
    Properties:
      FunctionName: vehicle-telemetry-transform
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TransformRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        ZipFile: |
          import base64, json, math
          from datetime import datetime

          FLOATS = {
              "tyre_fl_psi": (0, 100), "tyre_fr_psi": (0, 100),
              "tyre_rl_psi": (0, 100), "tyre_rr_psi": (0, 100),
              "accelerator_pct": (0, 100), "clutch_pct": (0, 100),
              "speed_kmph": (0, 400), "fuel_level_pct": (0, 100),
              "fuel_efficiency_kmpl": (0, 100),
          }
          HELPERS = ("topic_vehicle_id",)
          MAX_FUTURE_MS = 300000


          def to_ms(t):
              """ISO-8601 with a time zone (Z or +hh:mm) -> epoch ms, else None."""
              if not isinstance(t, str):
                  return None
              try:
                  dt = datetime.fromisoformat(t.strip().replace("Z", "+00:00"))
              except ValueError:
                  return None
              return int(dt.timestamp() * 1000) if dt.tzinfo else None


          def normalize(raw):
              """Known fields are typed and range-checked; unknown fields are kept in 'extras'."""
              if not isinstance(raw, dict):
                  raise ValueError("payload is not a JSON object")
              issues = []
              vid = raw.get("vehicle_id")
              topic_id = raw.get("topic_vehicle_id")
              if topic_id:
                  if vid and vid != topic_id:
                      issues.append("vehicle_id_mismatch")
                  vid = topic_id
              if not vid or not isinstance(vid, str):
                  raise ValueError("missing vehicle_id")
              out = {"vehicle_id": vid, "event_time": raw.get("event_time"),
                     "ingest_ts": raw.get("ingest_ts"),
                     "schema_version": str(raw.get("schema_version", "1"))}
              if out["event_time"] is None:
                  issues.append("missing_event_time")
              else:
                  ems = to_ms(out["event_time"])
                  ing = out["ingest_ts"] if isinstance(out["ingest_ts"], (int, float)) else None
                  if ems is None:
                      issues.append("bad_event_time")
                  elif ing is not None and ems > ing + MAX_FUTURE_MS:
                      issues.append("future_event_time")
              for f, (lo, hi) in FLOATS.items():
                  v = raw.get(f)
                  if v is None:
                      out[f] = None
                      continue
                  try:
                      if isinstance(v, bool):
                          raise ValueError
                      x = float(v)
                      if not math.isfinite(x):
                          raise ValueError
                  except (TypeError, ValueError):
                      out[f] = None
                      issues.append("not_numeric:" + f)
                      continue
                  if x < lo or x > hi:
                      out[f] = None
                      issues.append("out_of_range:" + f)
                  else:
                      out[f] = x
              extras = {k: v for k, v in raw.items() if k not in out and k not in HELPERS}
              out["extras"] = json.dumps(extras, separators=(",", ":")) if extras else None
              out["dq_issues"] = ",".join(issues) if issues else None
              return out


          def handler(event, context):
              records = []
              for r in event["records"]:
                  try:
                      out = normalize(json.loads(base64.b64decode(r["data"])))
                      data = base64.b64encode((json.dumps(out, separators=(",", ":")) + "\n").encode()).decode()
                      records.append({"recordId": r["recordId"], "result": "Ok", "data": data})
                  except Exception:
                      records.append({"recordId": r["recordId"], "result": "ProcessingFailed", "data": r["data"]})
              return {"records": records}

  # ---------------------------------------------------------------- ingestion buffer (v5.0)
  # One durable, ordered stream between IoT Core and every consumer: 24 h replay, per-vehicle ordering
  TelemetryStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: vehicle-telemetry-stream
      RetentionPeriodHours: 24
      StreamModeDetails:
        StreamMode: !Ref StreamMode
      ShardCount: !If [Provisioned, !Ref ShardCount, !Ref AWS::NoValue]
      StreamEncryption:
        EncryptionType: KMS
        KeyId: alias/aws/kinesis

  # ---------------------------------------------------------------- delivery stream (history path)
  FirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: firehose.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: firehose-permissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub "${DataBucket.Arn}/*"
              - Effect: Allow
                Action: [kinesis:DescribeStream, kinesis:DescribeStreamSummary, kinesis:GetShardIterator, kinesis:GetRecords, kinesis:ListShards]
                Resource: !GetAtt TelemetryStream.Arn
              - Effect: Allow
                Action: [glue:GetTable, glue:GetTableVersion, glue:GetTableVersions]
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/vehicle_telemetry"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/vehicle_telemetry/telemetry"
              - Effect: Allow
                Action: [lambda:InvokeFunction, lambda:GetFunctionConfiguration]
                Resource: !GetAtt TransformFunction.Arn
              - Effect: Allow
                Action: logs:PutLogEvents
                Resource: !GetAtt FirehoseLogGroup.Arn

  DeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamType: KinesisStreamAsSource
      KinesisStreamSourceConfiguration:
        KinesisStreamARN: !GetAtt TelemetryStream.Arn
        RoleARN: !GetAtt FirehoseRole.Arn
      ExtendedS3DestinationConfiguration:
        BucketARN: !GetAtt DataBucket.Arn
        RoleARN: !GetAtt FirehoseRole.Arn
        Prefix: "telemetry/dt=!{timestamp:yyyy-MM-dd}/hr=!{timestamp:HH}/"
        ErrorOutputPrefix: "errors/!{firehose:error-output-type}/dt=!{timestamp:yyyy-MM-dd}/"
        # Parquet needs a buffer of at least 64 MB; the interval decides how often a file is written.
        BufferingHints:
          IntervalInSeconds: !Ref BufferIntervalSeconds
          SizeInMBs: 64
        CompressionFormat: UNCOMPRESSED
        DataFormatConversionConfiguration:
          Enabled: true
          InputFormatConfiguration:
            Deserializer:
              OpenXJsonSerDe: {}
          OutputFormatConfiguration:
            Serializer:
              ParquetSerDe:
                Compression: SNAPPY
          SchemaConfiguration:
            CatalogId: !Ref AWS::AccountId
            DatabaseName: !Ref GlueDatabase
            TableName: !Ref TelemetryTable
            Region: !Ref AWS::Region
            RoleARN: !GetAtt FirehoseRole.Arn
            VersionId: LATEST
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseLogGroup
          LogStreamName: !Ref FirehoseLogStream
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Lambda
              Parameters:
                - { ParameterName: LambdaArn, ParameterValue: !GetAtt TransformFunction.Arn }
                - { ParameterName: NumberOfRetries, ParameterValue: "3" }
                - { ParameterName: BufferSizeInMBs, ParameterValue: "1" }
                - { ParameterName: BufferIntervalInSeconds, ParameterValue: "60" }
        S3BackupMode: Enabled
        S3BackupConfiguration:
          BucketARN: !GetAtt DataBucket.Arn
          RoleARN: !GetAtt FirehoseRole.Arn
          Prefix: "raw/dt=!{timestamp:yyyy-MM-dd}/"
          ErrorOutputPrefix: "errors/raw-backup/!{firehose:error-output-type}/dt=!{timestamp:yyyy-MM-dd}/"
          BufferingHints:
            IntervalInSeconds: !Ref BufferIntervalSeconds
            SizeInMBs: 64
          CompressionFormat: GZIP

  # ---------------------------------------------------------------- notifications
  AlertTopic:
    Type: AWS::SNS::Topic

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  OpsTopic:
    Type: AWS::SNS::Topic

  OpsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OpsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ---------------------------------------------------------------- real-time path: latest state + alerts
  LatestStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vehicle-latest-state
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - { AttributeName: vehicle_id, AttributeType: S }
      KeySchema:
        - { AttributeName: vehicle_id, KeyType: HASH }

  StateDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: vehicle-telemetry-state-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  StateRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: state-processor
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [kinesis:DescribeStream, kinesis:DescribeStreamSummary, kinesis:GetShardIterator, kinesis:GetRecords, kinesis:ListShards, kinesis:SubscribeToShard]
                Resource: !GetAtt TelemetryStream.Arn
              - Effect: Allow
                Action: kinesis:ListStreams
                Resource: "*"
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt LatestStateTable.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt StateDLQ.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt StateLogGroup.Arn

  StateFunction:
    Type: AWS::Lambda::Function
    DependsOn: StateLogGroup
    Properties:
      FunctionName: vehicle-telemetry-state
      Description: Latest state per vehicle (newest valid event wins) and low-tyre alerts with hysteresis, reminders and recovery
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt StateRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref LatestStateTable
          TOPIC: !Ref AlertTopic
          LOW_PSI: !Ref LowTyrePsi
          COOLDOWN: !Ref AlertCooldownSeconds
          REARM_MARGIN_PSI: "1.0"
          MAX_FUTURE_SKEW_S: "300"
      Code:
        ZipFile: |
          import base64, json, os, time
          from datetime import datetime
          import boto3
          from botocore.exceptions import ClientError

          ddb, sns = boto3.client("dynamodb"), boto3.client("sns")
          TABLE, TOPIC = os.environ["TABLE"], os.environ["TOPIC"]
          LOW = float(os.environ["LOW_PSI"])
          REARM = LOW + float(os.environ.get("REARM_MARGIN_PSI", "1.0"))
          COOL = int(os.environ["COOLDOWN"])
          MAX_FUTURE_MS = int(os.environ.get("MAX_FUTURE_SKEW_S", "300")) * 1000
          RANGES = {"tyre_fl_psi": (0, 100), "tyre_fr_psi": (0, 100), "tyre_rl_psi": (0, 100), "tyre_rr_psi": (0, 100),
                    "accelerator_pct": (0, 100), "clutch_pct": (0, 100), "speed_kmph": (0, 400),
                    "fuel_level_pct": (0, 100), "fuel_efficiency_kmpl": (0, 100)}
          TYRES = ("tyre_fl_psi", "tyre_fr_psi", "tyre_rl_psi", "tyre_rr_psi")
          CCF = "ConditionalCheckFailedException"
          KEY = lambda vid: {"vehicle_id": {"S": vid}}

          def num(v, lo, hi):
              if isinstance(v, bool):
                  return None
              try:
                  x = float(v)
              except (TypeError, ValueError):
                  return None
              return x if lo <= x <= hi else None

          def to_ms(t):
              if not isinstance(t, str):
                  return None
              try:
                  dt = datetime.fromisoformat(t.strip().replace("Z", "+00:00"))
              except ValueError:
                  return None
              return int(dt.timestamp() * 1000) if dt.tzinfo else None

          def parse(data, now_ms):
              try:
                  m = json.loads(base64.b64decode(data))
              except ValueError:
                  return None, "Skipped"
              if not isinstance(m, dict):
                  return None, "Skipped"
              vid = m.get("topic_vehicle_id") or m.get("vehicle_id")
              if not isinstance(vid, str) or not vid:
                  return None, "Skipped"
              ems = to_ms(m.get("event_time"))
              if ems is None:
                  return None, "BadTime"
              ing = m.get("ingest_ts")
              ing = int(ing) if isinstance(ing, (int, float)) and not isinstance(ing, bool) else now_ms
              if ems > ing + MAX_FUTURE_MS:
                  return None, "FutureSkew"
              vals = {f: num(m.get(f), lo, hi) for f, (lo, hi) in RANGES.items()}
              return {"vid": vid, "t": m["event_time"], "ems": ems, "ing": ing, "vals": vals}, None

          def save_state(r):
              sets, rem = ["event_time = :t", "event_ms = :e", "ingest_ts = :i"], ["offline_since"]
              vals = {":t": {"S": r["t"]}, ":e": {"N": str(r["ems"])}, ":i": {"N": str(r["ing"])}}
              for f, x in r["vals"].items():
                  if x is None:
                      rem.append(f)
                  else:
                      sets.append(f"{f} = :{f}")
                      vals[":" + f] = {"N": repr(x)}
              try:
                  ddb.update_item(TableName=TABLE, Key=KEY(r["vid"]),
                                  UpdateExpression="SET " + ", ".join(sets) + " REMOVE " + ", ".join(rem),
                                  ConditionExpression="attribute_not_exists(event_ms) OR event_ms <= :e",
                                  ExpressionAttributeValues=vals)
                  return True
              except ClientError as e:
                  if e.response["Error"]["Code"] == CCF:
                      return False
                  raise

          def publish(vid, kind, subject, body):
              sns.publish(TopicArn=TOPIC, Subject=subject[:100], Message=json.dumps(body),
                          MessageAttributes={"vehicle_id": {"DataType": "String", "StringValue": vid},
                                             "alert_type": {"DataType": "String", "StringValue": kind}})

          def alert(r, now):
              vid, tyres = r["vid"], {f: r["vals"][f] for f in TYRES}
              low = {f: v for f, v in tyres.items() if v is not None and v < LOW}
              if low:
                  try:
                      old = ddb.update_item(TableName=TABLE, Key=KEY(vid), ReturnValues="UPDATED_OLD",
                                            UpdateExpression="SET alert_active = :y, alert_until = :u",
                                            ConditionExpression="attribute_not_exists(alert_until) OR alert_until < :n",
                                            ExpressionAttributeValues={":y": {"BOOL": True}, ":u": {"N": str(now + COOL)},
                                                                       ":n": {"N": str(now)}}).get("Attributes", {})
                  except ClientError as e:
                      if e.response["Error"]["Code"] == CCF:
                          return "AlertsSuppressed"
                      raise
                  first = "alert_active" not in old
                  try:
                      publish(vid, "low_tyre", ("Low tyre pressure: " if first else "Still low tyre pressure: ") + vid,
                              {"vehicle_id": vid, "event_time": r["t"], "low_tyres_psi": low, "threshold_psi": LOW,
                               "first_alert": first, "next_reminder_after_s": COOL})
                  except Exception:
                      ddb.update_item(TableName=TABLE, Key=KEY(vid),
                                      UpdateExpression="REMOVE alert_until" + (", alert_active" if first else ""))
                      raise
                  return "AlertsSent"
              if all(v is not None and v >= REARM for v in tyres.values()):
                  try:
                      ddb.update_item(TableName=TABLE, Key=KEY(vid), UpdateExpression="REMOVE alert_active, alert_until",
                                      ConditionExpression="alert_active = :y", ExpressionAttributeValues={":y": {"BOOL": True}})
                  except ClientError as e:
                      if e.response["Error"]["Code"] == CCF:
                          return None
                      raise
                  try:
                      publish(vid, "recovered", "Tyre pressure back to normal: " + vid,
                              {"vehicle_id": vid, "event_time": r["t"], "tyres_psi": tyres, "rearm_psi": REARM})
                  except Exception:
                      ddb.update_item(TableName=TABLE, Key=KEY(vid), UpdateExpression="SET alert_active = :y",
                                      ExpressionAttributeValues={":y": {"BOOL": True}})
                      raise
                  return "Recovered"
              return None

          NAMES = ("Records", "Updated", "Stale", "Skipped", "BadTime", "FutureSkew",
                   "AlertsSent", "AlertsSuppressed", "Recovered", "Failed")

          def handler(event, context):
              now = int(time.time())
              c, failed = dict.fromkeys(NAMES, 0), []
              for rec in event["Records"]:
                  c["Records"] += 1
                  r, why = parse(rec["kinesis"]["data"], now * 1000)
                  if r is None:
                      c[why] += 1
                      continue
                  try:
                      if save_state(r):
                          c["Updated"] += 1
                          a = alert(r, now)
                          if a:
                              c[a] += 1
                      else:
                          c["Stale"] += 1
                  except Exception as e:
                      print(json.dumps({"level": "ERROR", "vehicle_id": r["vid"], "error": repr(e)[:300]}))
                      c["Failed"] += 1
                      failed.append({"itemIdentifier": rec["kinesis"]["sequenceNumber"]})
              print(json.dumps({"_aws": {"Timestamp": now * 1000, "CloudWatchMetrics": [{
                  "Namespace": "VehicleTelemetry", "Dimensions": [["Stage"]],
                  "Metrics": [{"Name": k, "Unit": "Count"} for k in NAMES]}]}, "Stage": "state", **c}))
              return {"batchItemFailures": failed}

  StateEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt TelemetryStream.Arn
      FunctionName: !Ref StateFunction
      StartingPosition: TRIM_HORIZON
      BatchSize: !Ref StateBatchSize
      MaximumBatchingWindowInSeconds: 1
      # Up to 10 batches per shard run at once; readings of one vehicle (same partition key) still stay in order.
      ParallelizationFactor: 10
      BisectBatchOnFunctionError: true
      MaximumRetryAttempts: 3
      MaximumRecordAgeInSeconds: 3600
      FunctionResponseTypes: [ReportBatchItemFailures]
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt StateDLQ.Arn

  # ---------------------------------------------------------------- per-vehicle offline detection
  OfflineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vehicle-telemetry-offline-check
      RetentionInDays: 30

  OfflineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: offline-check
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Scan, dynamodb:UpdateItem]
                Resource: !GetAtt LatestStateTable.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt OfflineLogGroup.Arn

  OfflineFunction:
    Type: AWS::Lambda::Function
    DependsOn: OfflineLogGroup
    Properties:
      FunctionName: vehicle-telemetry-offline-check
      Description: Every 5 minutes, reports vehicles with no reading for OfflineAfterMinutes (once per vehicle)
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt OfflineRole.Arn
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref LatestStateTable
          TOPIC: !Ref AlertTopic
          OFFLINE_AFTER_MIN: !Ref OfflineAfterMinutes
      Code:
        ZipFile: |
          import json, os, time
          import boto3
          from botocore.exceptions import ClientError

          ddb, sns = boto3.client("dynamodb"), boto3.client("sns")
          TABLE, TOPIC = os.environ["TABLE"], os.environ["TOPIC"]
          AFTER_MS = int(os.environ["OFFLINE_AFTER_MIN"]) * 60 * 1000

          def handler(event, context):
              now = int(time.time() * 1000)
              cutoff, seen, offline, newly = now - AFTER_MS, 0, 0, []
              kw = {"TableName": TABLE, "ProjectionExpression": "vehicle_id, ingest_ts, offline_since"}
              while True:
                  page = ddb.scan(**kw)
                  for it in page.get("Items", []):
                      seen += 1
                      last = int(float(it.get("ingest_ts", {}).get("N", "0")))
                      if last >= cutoff:
                          continue
                      offline += 1
                      if "offline_since" in it:
                          continue
                      vid = it["vehicle_id"]["S"]
                      try:
                          ddb.update_item(TableName=TABLE, Key={"vehicle_id": {"S": vid}},
                                          UpdateExpression="SET offline_since = :n",
                                          ConditionExpression="attribute_not_exists(offline_since) AND ingest_ts < :c",
                                          ExpressionAttributeValues={":n": {"N": str(now)}, ":c": {"N": str(cutoff)}})
                          newly.append({"vehicle_id": vid, "last_seen_min_ago": round((now - last) / 60000, 1)})
                      except ClientError as e:
                          if e.response["Error"]["Code"] != "ConditionalCheckFailedException":
                              raise
                  if "LastEvaluatedKey" not in page:
                      break
                  kw["ExclusiveStartKey"] = page["LastEvaluatedKey"]
              if newly:
                  sns.publish(TopicArn=TOPIC, Subject=f"{len(newly)} vehicle(s) went offline",
                              Message=json.dumps({"offline_after_min": AFTER_MS // 60000, "count": len(newly),
                                                  "vehicles": newly[:50], "more": max(0, len(newly) - 50)}),
                              MessageAttributes={"alert_type": {"DataType": "String", "StringValue": "offline"}})
              print(json.dumps({"_aws": {"Timestamp": now, "CloudWatchMetrics": [{
                  "Namespace": "VehicleTelemetry", "Dimensions": [["Stage"]],
                  "Metrics": [{"Name": k, "Unit": "Count"} for k in ("VehiclesSeen", "VehiclesOffline", "NewlyOffline")]}]},
                  "Stage": "offline-check", "VehiclesSeen": seen, "VehiclesOffline": offline, "NewlyOffline": len(newly)}))
              return {"seen": seen, "offline": offline, "newly_offline": len(newly)}

  OfflineSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: vehicle-telemetry-offline-check
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - { Id: offline-check, Arn: !GetAtt OfflineFunction.Arn }

  OfflinePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OfflineFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt OfflineSchedule.Arn

  # ---------------------------------------------------------------- IoT rule (one rule, one action)
  IotRuleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: iot.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: iot-rule-actions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: kinesis:PutRecord
                Resource: !GetAtt TelemetryStream.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt IotErrorLogGroup.Arn

  TelemetryRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: vehicle_telemetry_ingest
      TopicRulePayload:
        # vehicle id comes from the authenticated MQTT topic (topic(2)); it is also the partition key,
        Sql: "SELECT *, topic(2) AS topic_vehicle_id, timestamp() AS ingest_ts FROM 'vehicles/+/telemetry'"
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Actions:
          - Kinesis:
              StreamName: !Ref TelemetryStream
              PartitionKey: "${topic(2)}"
              RoleArn: !GetAtt IotRuleRole.Arn
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref IotErrorLogGroup
            RoleArn: !GetAtt IotRuleRole.Arn

  # ---------------------------------------------------------------- device identity (real hardware)
  DevicePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: vehicle-device-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:Connection.Thing.ThingName}"
          - Effect: Allow
            Action: iot:Publish
            Resource: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/vehicles/${!iot:Connection.Thing.ThingName}/telemetry"
          - Effect: Allow
            Action: iot:Subscribe
            Resource: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/vehicles/${!iot:Connection.Thing.ThingName}/commands/*"
          - Effect: Allow
            Action: iot:Receive
            Resource: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/vehicles/${!iot:Connection.Thing.ThingName}/commands/*"

  # ---------------------------------------------------------------- catalog + query
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: vehicle_telemetry

  TelemetryTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: telemetry
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2026-10-01,NOW"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          projection.hr.type: integer
          projection.hr.range: "0,23"
          projection.hr.digits: "2"
          storage.location.template: !Sub "s3://${DataBucket}/telemetry/dt=${!dt}/hr=${!hr}/"
        PartitionKeys:
          - { Name: dt, Type: string }
          - { Name: hr, Type: string }
        StorageDescriptor:
          Location: !Sub "s3://${DataBucket}/telemetry/"
          # v5.0: Parquet (columnar, Snappy) written by Firehose. Athena reads only the columns a query
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - { Name: vehicle_id, Type: string }
            - { Name: event_time, Type: string }
            - { Name: tyre_fl_psi, Type: double }
            - { Name: tyre_fr_psi, Type: double }
            - { Name: tyre_rl_psi, Type: double }
            - { Name: tyre_rr_psi, Type: double }
            - { Name: accelerator_pct, Type: double }
            - { Name: clutch_pct, Type: double }
            - { Name: speed_kmph, Type: double }
            - { Name: fuel_level_pct, Type: double }
            - { Name: fuel_efficiency_kmpl, Type: double }
            - { Name: ingest_ts, Type: bigint }
            - { Name: schema_version, Type: string }
            - { Name: extras, Type: string }
            - { Name: dq_issues, Type: string }

  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: vehicle-telemetry
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: 1073741824
        ResultConfiguration:
          OutputLocation: !Sub "s3://${DataBucket}/athena-results/"
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

  # ---------------------------------------------------------------- observability
  NoDataAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: NoDataAlarmOn
    Properties:
      AlarmName: vehicle-telemetry-no-data
      AlarmDescription: No MQTT messages received for 10 minutes (fleet silent or ingestion broken)
      Namespace: AWS/IoT
      MetricName: PublishIn.Success
      Dimensions: [{ Name: Protocol, Value: MQTT }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref OpsTopic]
      OKActions: [!Ref OpsTopic]

  RuleFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vehicle-telemetry-iot-rule-failures
      AlarmDescription: The IoT rule could not write to the Kinesis stream (see log group /vehicle-telemetry/iot-rule-errors)
      Namespace: AWS/IoT
      MetricName: Failure
      Dimensions: [{ Name: RuleName, Value: vehicle_telemetry_ingest }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  StreamThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vehicle-telemetry-stream-throttled
      AlarmDescription: Writes to the Kinesis stream were throttled - add shards (ShardCount) or use StreamMode ON_DEMAND
      Namespace: AWS/Kinesis
      MetricName: WriteProvisionedThroughputExceeded
      Dimensions: [{ Name: StreamName, Value: !Ref TelemetryStream }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  FirehoseDeliveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vehicle-telemetry-firehose-delivery
      AlarmDescription: Firehose failed to deliver to S3
      Namespace: AWS/Firehose
      MetricName: DeliveryToS3.Success
      Dimensions: [{ Name: DeliveryStreamName, Value: !Ref DeliveryStream }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  FirehoseFreshnessAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vehicle-telemetry-data-freshness
      AlarmDescription: Oldest record waiting in Firehose is older than 20 minutes
      Namespace: AWS/Firehose
      MetricName: DeliveryToS3.DataFreshness
      Dimensions: [{ Name: DeliveryStreamName, Value: !Ref DeliveryStream }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1200
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  ConversionFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vehicle-telemetry-parquet-conversion-failed
      AlarmDescription: Firehose could not convert records to Parquet (they are in errors/format-conversion-failed/)
      Namespace: AWS/Firehose
      MetricName: FailedConversion.Records
      Dimensions: [{ Name: DeliveryStreamName, Value: !Ref DeliveryStream }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  OfflineCheckErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vehicle-telemetry-offline-check-errors
      AlarmDescription: The offline-detection Lambda failed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref OfflineFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  TransformErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vehicle-telemetry-transform-errors
      AlarmDescription: The validation Lambda crashed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref TransformFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  StateErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vehicle-telemetry-state-errors
      AlarmDescription: The latest-state/alert Lambda failed (it retries; see /aws/lambda/vehicle-telemetry-state)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref StateFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  StateLagAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vehicle-telemetry-state-lag
      AlarmDescription: The latest state is more than 60 seconds behind the stream (Lambda iterator age)
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions: [{ Name: FunctionName, Value: !Ref StateFunction }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 60000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vehicle-telemetry-state-dlq
      AlarmDescription: Readings that failed every retry are waiting in the dead-letter queue vehicle-telemetry-state-dlq
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt StateDLQ.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  AlertDeliveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vehicle-telemetry-alert-delivery-failed
      AlarmDescription: SNS could not deliver a driver/support alert
      Namespace: AWS/SNS
      MetricName: NumberOfNotificationsFailed
      Dimensions: [{ Name: TopicName, Value: !GetAtt AlertTopic.TopicName }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: vehicle-telemetry
      DashboardBody: !Sub |
        {"widgets":[
         {"type":"metric","x":0,"y":0,"width":8,"height":6,"properties":{"title":"Messages from vehicles (MQTT publish in)","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["AWS/IoT","PublishIn.Success","Protocol","MQTT"],["AWS/IoT","Success","RuleName","vehicle_telemetry_ingest"],["AWS/IoT","Failure","RuleName","vehicle_telemetry_ingest"]]}},
         {"type":"metric","x":8,"y":0,"width":8,"height":6,"properties":{"title":"Kinesis stream: records in / throttled","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["AWS/Kinesis","IncomingRecords","StreamName","${TelemetryStream}"],["AWS/Kinesis","WriteProvisionedThroughputExceeded","StreamName","${TelemetryStream}"]]}},
         {"type":"metric","x":16,"y":0,"width":8,"height":6,"properties":{"title":"Latest-state lag (ms, iterator age)","region":"${AWS::Region}","stat":"Maximum","period":60,"metrics":[["AWS/Lambda","IteratorAge","FunctionName","${StateFunction}"]]}},
         {"type":"metric","x":0,"y":6,"width":8,"height":6,"properties":{"title":"Firehose records and delivery","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["AWS/Firehose","IncomingRecords","DeliveryStreamName","${DeliveryStream}"],["AWS/Firehose","DeliveryToS3.Records","DeliveryStreamName","${DeliveryStream}"]]}},
         {"type":"metric","x":8,"y":6,"width":8,"height":6,"properties":{"title":"History freshness (seconds)","region":"${AWS::Region}","stat":"Maximum","period":60,"metrics":[["AWS/Firehose","DeliveryToS3.DataFreshness","DeliveryStreamName","${DeliveryStream}"]]}},
         {"type":"metric","x":16,"y":6,"width":8,"height":6,"properties":{"title":"State Lambda: updated / stale / alerts","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["VehicleTelemetry","Updated","Stage","state"],["VehicleTelemetry","Stale","Stage","state"],["VehicleTelemetry","AlertsSent","Stage","state"],["VehicleTelemetry","AlertsSuppressed","Stage","state"],["VehicleTelemetry","Recovered","Stage","state"],["VehicleTelemetry","FutureSkew","Stage","state"],["VehicleTelemetry","BadTime","Stage","state"],["VehicleTelemetry","Failed","Stage","state"]]}},
         {"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{"title":"Lambdas: invocations / errors","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["AWS/Lambda","Invocations","FunctionName","${TransformFunction}"],["AWS/Lambda","Errors","FunctionName","${TransformFunction}"],["AWS/Lambda","Invocations","FunctionName","${StateFunction}"],["AWS/Lambda","Errors","FunctionName","${StateFunction}"]]}},
         {"type":"metric","x":12,"y":12,"width":6,"height":6,"properties":{"title":"Vehicles offline","region":"${AWS::Region}","stat":"Maximum","period":300,"metrics":[["VehicleTelemetry","VehiclesOffline","Stage","offline-check"],["VehicleTelemetry","VehiclesSeen","Stage","offline-check"]]}},
         {"type":"metric","x":18,"y":12,"width":6,"height":6,"properties":{"title":"Alert emails (SNS)","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["AWS/SNS","NumberOfMessagesPublished","TopicName","${AlertTopic.TopicName}"],["AWS/SNS","NumberOfNotificationsFailed","TopicName","${AlertTopic.TopicName}"]]}},
         {"type":"alarm","x":0,"y":18,"width":24,"height":4,"properties":{"title":"Alarm status","alarms":["${RuleFailureAlarm.Arn}","${StreamThrottleAlarm.Arn}","${FirehoseDeliveryAlarm.Arn}","${FirehoseFreshnessAlarm.Arn}","${TransformErrorAlarm.Arn}","${StateErrorAlarm.Arn}","${StateLagAlarm.Arn}","${DeadLetterAlarm.Arn}","${ConversionFailureAlarm.Arn}","${OfflineCheckErrorAlarm.Arn}","${AlertDeliveryAlarm.Arn}"]}}
        ]}

Outputs:
  Bucket:
    Value: !Ref DataBucket
  TopicPattern:
    Value: vehicles/<vehicle_id>/telemetry
  Stream:
    Value: !Ref TelemetryStream
  AthenaWorkgroup:
    Value: !Ref AthenaWorkgroup
  LatestStateTable:
    Value: !Ref LatestStateTable
  DeadLetterQueue:
    Value: !Ref StateDLQ
  DashboardName:
    Value: vehicle-telemetry
  DevicePolicyName:
    Value: vehicle-device-policy
